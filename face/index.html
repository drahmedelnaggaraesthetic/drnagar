MAS)</option><option value="brow">رفع الحاجب (Brow Lift)</option><option value="rhino">تجميل الأنف التحفظي والوظيفي</option><option value="oto">تجميل الأذن البارزة (Otoplasty)</option></select></label></div><div class="dre-stack"><div class="dre-panel-soft"><div class="dre-small dre-bidi-passage" style="font-weight: 800; margin-bottom: 8px;" dir="rtl">1. الطبقة المستهدفة</div><div class="dre-grid dre-grid-2"><div><span class="dre-badge">إندوليفت الهجين (Hybrid Endolift 1500nm)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">تحت الجلد والحواجز الليفية</p></div><div><span class="dre-badge dre-badge-gold">الخيوط التجميلية (Aptos / PCL)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">فوق طبقة الـ SMAS والدهون السطحية</p></div></div></div><div class="dre-panel-soft"><div class="dre-small dre-bidi-passage" style="font-weight: 800; margin-bottom: 8px;" dir="rtl">2. الآلية</div><div class="dre-grid dre-grid-2"><div><span class="dre-badge">إندوليفت الهجين (Hybrid Endolift 1500nm)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">ليف ليزر مجهري تحت الجلد بدون جروح لإذابة دهون اللغد وشد خط الفك وبناء الكولاجين.</p></div><div><span class="dre-badge dre-badge-gold">الخيوط التجميلية (Aptos / PCL)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">رفع ميكانيكي فوري للخدين وخط الفك مع بناء غلاف كولاجين داعم.</p></div></div></div><div class="dre-panel-soft"><div class="dre-small dre-bidi-passage" style="font-weight: 800; margin-bottom: 8px;" dir="rtl">3. المرشح المثالي</div><div class="dre-grid dre-grid-2"><div><span class="dre-badge">إندوليفت الهجين (Hybrid Endolift 1500nm)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">ارتخاء خط الفك واللغد الخفيف إلى المتوسط لمن يفضل الشد بدون جراحة.</p></div><div><span class="dre-badge dre-badge-gold">الخيوط التجميلية (Aptos / PCL)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">هبوط خفيف إلى متوسط بمنتصف الوجه وخط الفك مع سماكة جلد مناسبة.</p></div></div></div><div class="dre-panel-soft"><div class="dre-small dre-bidi-passage" style="font-weight: 800; margin-bottom: 8px;" dir="rtl">4. متى لا يُنصح به</div><div class="dre-grid dre-grid-2"><div><span class="dre-badge">إندوليفت الهجين (Hybrid Endolift 1500nm)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">الترهل الجلدي الشديد المتدلي أو أوتار الرقبة البارزة.</p></div><div><span class="dre-badge dre-badge-gold">الخيوط التجميلية (Aptos / PCL)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">الجلد شديد الرقة أو الترهل الجلدي الثقيل المتقدم.</p></div></div></div><div class="dre-panel-soft"><div class="dre-small dre-bidi-passage" style="font-weight: 800; margin-bottom: 8px;" dir="rtl">5. التخدير</div><div class="dre-grid dre-grid-2"><div><span class="dre-badge">إندوليفت الهجين (Hybrid Endolift 1500nm)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">تخدير موضعي بالعيادة</p></div><div><span class="dre-badge dre-badge-gold">الخيوط التجميلية (Aptos / PCL)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">تخدير موضعي بالعيادة</p></div></div></div><div class="dre-panel-soft"><div class="dre-small dre-bidi-passage" style="font-weight: 800; margin-bottom: 8px;" dir="rtl">6. التعافي</div><div class="dre-grid dre-grid-2"><div><span class="dre-badge">إندوليفت الهجين (Hybrid Endolift 1500nm)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">2 – 4 أيام</p></div><div><span class="dre-badge dre-badge-gold">الخيوط التجميلية (Aptos / PCL)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">3 – 5 أيام</p></div></div></div><div class="dre-panel-soft"><div class="dre-small dre-bidi-passage" style="font-weight: 800; margin-bottom: 8px;" dir="rtl">7. الاستمرارية</div><div class="dre-grid dre-grid-2"><div><span class="dre-badge">إندوليفت الهجين (Hybrid Endolift 1500nm)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">2 – 3 سنوات</p></div><div><span class="dre-badge dre-badge-gold">الخيوط التجميلية (Aptos / PCL)</span><p class="dre-small dre-bidi-passage" style="margin-top: 6px;" dir="rtl">12 – 18 شهراً</p></div></div></div></div></div></div></div><div hidden="" class="dre-instrument"><div class="dre-stack"><div class="dre-panel"><div style="margin-bottom: 14px;"><div class="dre-kicker">بعد التخسيس</div><div class="dre-h2 dre-bidi-passage" dir="rtl">حاسبة جاهزية الوجه بعد نزول الوزن</div><p class="dre-sub dre-bidi-passage" dir="rtl">خاصة بعد إبر التخسيس (GLP-1) أو عمليات السمنة</p></div><label class="dre-field"><span class="dre-field-lbl dre-bidi-passage" dir="rtl">مقدار النزول: ١٥ كجم</span><input type="range" min="0" max="70" value="15"></label><div class="dre-grid dre-grid-2"><label class="dre-field"><span class="dre-field-lbl dre-bidi-passage" dir="rtl">طريقة النزول</span><select class="dre-input"><option value="diet">دايت ورياضة</option><option value="glp1">حقن تخسيس</option><option value="bariatric">تكميم / جراحة سمنة</option></select></label><label class="dre-field"><span class="dre-field-lbl dre-bidi-passage" dir="rtl">شهور ثبات الوزن</span><select class="dre-input"><option value="1">أقل من ٣ شهور</option><option value="4">٣ – ٦ شهور</option><option value="8">أكثر من ٦ شهور</option></select></label></div><div class="dre-alert dre-alert-warn"><strong>مرحلة تهيئة جلدية فقط (Olidia أو Jovena)</strong><div style="margin-top: 4px;">بعد حقن التخسيس، نبدأ بتقوية ألياف الكولاجين في غلاف الجلد (Olidia PLLA أو Jovena) مع فحص الهيموجلوبين والزلال، ثم نقرر الشد أو Microfat عند تمام الاستقرار.</div></div></div><div class="dre-panel"><div style="margin-bottom: 14px;"><div class="dre-kicker">مخطط الصيانة السنوي</div><div class="dre-h2 dre-bidi-passage" dir="rtl">خطة ١٢ شهراً للوجه والرقبة</div><p class="dre-sub dre-bidi-passage" dir="rtl">خطة ربع سنوية (Q1 – Q4) للحفاظ على تماسك ونضارة النتائج</p></div><div class="dre-grid dre-grid-2" style="margin-bottom: 12px;"><label class="dre-field"><span class="dre-field-lbl dre-bidi-passage" dir="rtl">الفئة العمرية</span><select class="dre-input"><option value="20s">عشرينات – ثلاثينات</option><option value="40s">أربعينات</option><option value="50s">خمسينات+</option></select></label><label class="dre-field"><span class="dre-field-lbl dre-bidi-passage" dir="rtl">التركيز الأساسي</span><select class="dre-input"><option value="glow">نضارة</option><option value="lift">شد</option><option value="postop">بعد جراحة</option></select></label></div><div class="dre-stack"><div class="dre-panel-soft"><strong style="color: var(--dre-gold-2);">Q1 (الربع الأول)</strong><div class="dre-small dre-bidi-passage" style="margin-top: 4px;" dir="rtl">إجراء الشد الأساسي (Hybrid Endolift أو خيوط Aptos) لرفع خط الفك واللغد.</div></div><div class="dre-panel-soft"><strong style="color: var(--dre-gold-2);">Q2 (الربع الثاني)</strong><div class="dre-small dre-bidi-passage" style="margin-top: 4px;" dir="rtl">جلسة محفز كولاجين Olidia لتثبيت الشد ورفع كثافة الأدمة.</div></div><div class="dre-panel-soft"><strong style="color: var(--dre-gold-2);">Q3 (الربع الثالث)</strong><div class="dre-small dre-bidi-passage" style="margin-top: 4px;" dir="rtl">بوتوكس تقنية نفرتيتي لإرخاء أوتار الرقبة الساحبة والحفاظ على تحديد الفك.</div></div><div class="dre-panel-soft"><strong style="color: var(--dre-gold-2);">Q4 (الربع الرابع)</strong><div class="dre-small dre-bidi-passage" style="margin-top: 4px;" dir="rtl">مراجعة سنوية وجلسة Jovena أو سكين بوستر لإطالة عمر النتيجة.</div></div></div></div></div></div></div><dre-recovery-guides lang="ar" groups="1"><section class="dre-guides" id="recovery-education"><header class="dre-guides-head"><span class="dre-kicker">مكتبة التعافي المصوّرة</span><h2 class="dre-h2 dre-bidi-passage" data-content-indicator="true" dir="rtl">دليلك المصوّر، خطوة بخطوة</h2><p class="dre-sub dre-bidi-passage" dir="rtl">موضوعات مص
